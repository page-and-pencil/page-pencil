<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:'Pretendard','Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased;color:#14304A;}
  svg.lucide{stroke-width:1.7;vertical-align:middle;flex-shrink:0;}
  .mono{font-family:'Montserrat',sans-serif;}
</style>
</helmet>

<div style="height:100vh;display:flex;overflow:hidden;background:#fff;">

  <!-- left brand panel -->
  <div style="width:46%;flex-shrink:0;background:#0E2230;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:48px 52px;">
    <div style="position:absolute;top:-60px;right:-50px;width:280px;height:280px;border-radius:50%;background:rgba(12,164,201,.16);"></div>
    <div style="position:absolute;bottom:-80px;left:-60px;width:240px;height:240px;border-radius:50%;background:rgba(12,164,201,.1);"></div>

    <div class="mono" style="position:relative;font-size:22px;font-weight:700;color:#fff;letter-spacing:-.01em;">Page <span style="color:#0CA4C9;font-style:italic;">&amp;</span> Pencil</div>

    <div style="position:relative;">
      <div style="font-size:13px;font-weight:700;color:#0CA4C9;letter-spacing:.04em;margin-bottom:18px;">이해로 쌓은 영어</div>
      <h1 style="font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.3;color:#fff;margin-bottom:18px;text-wrap:balance;">시험이 끝나도<br>손에 남는 영어</h1>
      <p style="font-size:14.5px;line-height:1.8;color:rgba(255,255,255,.62);max-width:380px;text-wrap:pretty;">선생님, 학생, 학부모가 한 곳에서 만납니다. 수업 기록과 성장을 같은 화면으로 나눕니다.</p>
      <div style="display:flex;gap:14px;margin-top:34px;">
        <div style="display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.85);font-size:13px;font-weight:600;"><span style="width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#7FD4E2;"><i data-lucide="pencil" width="15" height="15"></i></span>수업 기록</div>
        <div style="display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.85);font-size:13px;font-weight:600;"><span style="width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#7FD4E2;"><i data-lucide="layers" width="15" height="15"></i></span>단어 학습</div>
        <div style="display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.85);font-size:13px;font-weight:600;"><span style="width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#7FD4E2;"><i data-lucide="trending-up" width="15" height="15"></i></span>성장 추이</div>
      </div>
    </div>

    <div style="position:relative;font-size:12px;color:rgba(255,255,255,.4);">초·중등 영어 공부방 · 소수 정예 밀착 지도</div>
  </div>

  <!-- right login -->
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px;">
    <div style="width:100%;max-width:380px;">
      <h2 style="font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px;">로그인</h2>
      <p style="font-size:13.5px;color:#8A95A2;margin-bottom:26px;">역할을 선택하고 들어오세요</p>

      <!-- role selector -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:24px;">
        <div style="border:1.5px solid #0CA4C9;background:#E3F5FA;border-radius:13px;padding:16px 8px;text-align:center;cursor:pointer;">
          <span style="width:38px;height:38px;border-radius:11px;background:#0CA4C9;color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 9px;"><i data-lucide="monitor" width="19" height="19"></i></span>
          <div style="font-size:13px;font-weight:800;color:#0B8DAE;">선생님</div>
        </div>
        <div style="border:1.5px solid rgba(15,48,74,.1);background:#fff;border-radius:13px;padding:16px 8px;text-align:center;cursor:pointer;">
          <span style="width:38px;height:38px;border-radius:11px;background:#F1F6F8;color:#5A6B7B;display:flex;align-items:center;justify-content:center;margin:0 auto 9px;"><i data-lucide="graduation-cap" width="19" height="19"></i></span>
          <div style="font-size:13px;font-weight:700;color:#5A6B7B;">학생</div>
        </div>
        <div style="border:1.5px solid rgba(15,48,74,.1);background:#fff;border-radius:13px;padding:16px 8px;text-align:center;cursor:pointer;">
          <span style="width:38px;height:38px;border-radius:11px;background:#F1F6F8;color:#5A6B7B;display:flex;align-items:center;justify-content:center;margin:0 auto 9px;"><i data-lucide="users" width="19" height="19"></i></span>
          <div style="font-size:13px;font-weight:700;color:#5A6B7B;">학부모</div>
        </div>
      </div>

      <!-- fields -->
      <div style="margin-bottom:16px;">
        <div style="font-size:11px;font-weight:700;letter-spacing:.05em;color:#5A6B7B;text-transform:uppercase;margin-bottom:7px;">아이디</div>
        <div style="display:flex;align-items:center;gap:10px;padding:13px 15px;border:1.5px solid rgba(15,48,74,.1);border-radius:11px;background:#F8FBFC;">
          <i data-lucide="user" width="17" height="17" style="color:#94A3AE;"></i>
          <span style="font-size:14px;color:#94A3AE;">sam.teacher</span>
        </div>
      </div>
      <div style="margin-bottom:14px;">
        <div style="font-size:11px;font-weight:700;letter-spacing:.05em;color:#5A6B7B;text-transform:uppercase;margin-bottom:7px;">비밀번호</div>
        <div style="display:flex;align-items:center;gap:10px;padding:13px 15px;border:1.5px solid #0CA4C9;border-radius:11px;background:#fff;box-shadow:0 0 0 3px rgba(12,164,201,.1);">
          <i data-lucide="lock" width="17" height="17" style="color:#0B8DAE;"></i>
          <span class="mono" style="flex:1;font-size:14px;letter-spacing:.2em;color:#14304A;">••••••••</span>
          <i data-lucide="eye" width="17" height="17" style="color:#94A3AE;"></i>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;">
        <div style="display:flex;align-items:center;gap:8px;"><span style="width:18px;height:18px;border-radius:5px;background:#0CA4C9;display:flex;align-items:center;justify-content:center;color:#fff;"><i data-lucide="check" width="12" height="12"></i></span><span style="font-size:12.5px;color:#5A6B7B;font-weight:600;">로그인 유지</span></div>
        <span style="font-size:12.5px;color:#0B8DAE;font-weight:600;">비밀번호 찾기</span>
      </div>

      <button style="width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:15px;border:none;background:#0CA4C9;color:#fff;border-radius:12px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 6px 18px rgba(12,164,201,.32);margin-bottom:18px;">선생님으로 로그인<i data-lucide="arrow-right" width="17" height="17"></i></button>

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;"><span style="flex:1;height:1px;background:rgba(15,48,74,.1);"></span><span style="font-size:11.5px;color:#B8C0C8;">또는</span><span style="flex:1;height:1px;background:rgba(15,48,74,.1);"></span></div>

      <button style="width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:13px;border:1px solid rgba(15,48,74,.13);background:#fff;color:#14304A;border-radius:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;"><span style="width:18px;height:18px;border-radius:5px;background:#FEE500;display:flex;align-items:center;justify-content:center;"><i data-lucide="message-square" width="11" height="11" style="color:#14304A;"></i></span>카카오로 간편 로그인</button>

      <div style="text-align:center;margin-top:22px;font-size:13px;color:#8A95A2;">처음이세요? <span style="color:#0B8DAE;font-weight:700;">상담으로 시작하기</span></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:760}}">
class Component extends DCLogic {
  componentDidMount() {
    const draw = () => { if (window.lucide && window.lucide.createIcons) { try { window.lucide.createIcons(); } catch (e) {} } };
    let n = 0;
    const iv = setInterval(() => { draw(); if (window.lucide || ++n > 50) clearInterval(iv); }, 80);
    [200, 500, 1200].forEach(t => setTimeout(draw, t));
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
